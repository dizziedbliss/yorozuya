# Local dev + tests. Production uses Supabase (DATABASE_URL) and Railway for the API.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yorozuya
      POSTGRES_PASSWORD: yorozuya
      POSTGRES_DB: yorozuya
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yorozuya"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://yorozuya:yorozuya@db:5432/yorozuya
      SITE_PASSPHRASE: ${SITE_PASSPHRASE:-local-dev}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
