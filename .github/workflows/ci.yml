name: Yorozuya CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yorozuya
          POSTGRES_PASSWORD: yorozuya
          POSTGRES_DB: yorozuya
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U yorozuya"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Typecheck
        run: npx --yes pyright@1.1.414

      - name: Tests
        run: uv run pytest -q

  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Building Docker Image
        run: |
          cd backend
          docker buildx build --network=host -t yorozuya-backend .

      - name: Running the container
        run: |
          docker run \
          -e LOGO_DEV_PUBLIC_KEY="${{secrets.LOGO_DEV_PUBLIC_KEY}}" \
          -d -p 8000:8000 yorozuya-backend

      - name: Health check
        run: |
          sleep 5
          curl http://localhost:8000/jobs

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: |
          cd frontend 
          npm ci 
          npm run build
