[project]
name = "backend"
version = "0.1.0"
description = "Yorozuya's only backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "dotenv>=0.9.9",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "python-jobspy>=1.4.1",
    "sqlalchemy>=2",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 110
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "FAST"]

[tool.ruff.lint.per-file-ignores]
# Long literal expectations read better on one line than wrapped.
"tests/**" = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [".venv", "alembic/versions"]
